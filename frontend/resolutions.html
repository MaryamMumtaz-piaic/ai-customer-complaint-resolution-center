<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolutions Library | ComplaintIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <i data-lucide="cpu" class="w-6 h-6 text-indigo-600 mr-2"></i>
            <span class="text-xl font-bold text-slate-800">Complaint<span class="text-indigo-600">IQ</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="home" class="w-5 h-5 mr-3"></i>Dashboard</a>
            <a href="resolutions.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 bg-indigo-50 text-indigo-600"><i data-lucide="check-circle" class="w-5 h-5 mr-3"></i>Resolutions</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
            <h1 class="text-xl font-semibold text-slate-800">Previous Resolutions</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="relative max-w-xl w-full">
                    <i data-lucide="search" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" placeholder="Search resolutions by keyword, category..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="res-container">
                <!-- Injected via JS -->
            </div>
            
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/resolutions.js"></script>
</body>
</html>
