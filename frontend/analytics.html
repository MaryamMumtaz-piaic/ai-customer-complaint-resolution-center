<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | ComplaintIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <i data-lucide="cpu" class="w-6 h-6 text-indigo-600 mr-2"></i>
            <span class="text-xl font-bold text-slate-800">Complaint<span class="text-indigo-600">IQ</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="home" class="w-5 h-5 mr-3"></i>Dashboard</a>
            <a href="analytics.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 bg-indigo-50 text-indigo-600"><i data-lucide="bar-chart" class="w-5 h-5 mr-3"></i>Analytics</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
            <h1 class="text-xl font-semibold text-slate-800">Analytics</h1>
            <div class="flex gap-2">
                <select class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-white"><option>Last 30 Days</option><option>Last 90 Days</option></select>
                <button class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-white hover:bg-slate-50"><i data-lucide="download" class="w-4 h-4 inline mr-1"></i>Export</button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-sm font-medium text-slate-500 mb-1">Resolution Time</p>
                    <h4 class="text-2xl font-bold text-slate-800">4.2 hrs</h4>
                    <span class="text-xs text-emerald-600">-12% from last month</span>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-sm font-medium text-slate-500 mb-1">CSAT Score</p>
                    <h4 class="text-2xl font-bold text-slate-800">4.6/5.0</h4>
                    <span class="text-xs text-emerald-600">+0.2 from last month</span>
                </div>
                <!-- Add more as needed -->
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-semibold text-slate-800 mb-4">Volume Trends</h3>
                <div class="h-64 relative w-full"><canvas id="volumeChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-base font-semibold text-slate-800 mb-4">Category Distribution</h3>
                    <div class="h-64 relative w-full"><canvas id="distChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-base font-semibold text-slate-800 mb-4">Channel Usage</h3>
                    <div class="h-64 relative w-full"><canvas id="channelChart"></canvas></div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
