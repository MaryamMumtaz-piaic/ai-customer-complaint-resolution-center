<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | ComplaintIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <i data-lucide="cpu" class="w-6 h-6 text-indigo-600 mr-2"></i>
            <span class="text-xl font-bold text-slate-800">Complaint<span class="text-indigo-600">IQ</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="home" class="w-5 h-5 mr-3"></i>Dashboard</a>
            <a href="complaints.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50 bg-indigo-50 text-indigo-600"><i data-lucide="message-square" class="w-5 h-5 mr-3"></i>Complaints</a>
            <a href="complaint-new.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="plus-circle" class="w-5 h-5 mr-3"></i>New Complaint</a>
            <a href="ai-assistant.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="bot" class="w-5 h-5 mr-3"></i>AI Assistant</a>
            <a href="escalations.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="alert-triangle" class="w-5 h-5 mr-3"></i>Escalations</a>
            <a href="settings.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="settings" class="w-5 h-5 mr-3"></i>Settings</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
            <h1 class="text-xl font-semibold text-slate-800">Complaints List</h1>
            <div class="flex items-center gap-4">
                <a href="complaint-new.html" class="flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700"><i data-lucide="plus" class="w-4 h-4 mr-2"></i>New Complaint</a>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 flex flex-col">
            <!-- Filters -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Search</label>
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="text" placeholder="ID, Customer, Subject..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
                <div class="w-40">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Status</label>
                    <select class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"><option>All Statuses</option><option>New</option><option>In Progress</option><option>Escalated</option><option>Resolved</option></select>
                </div>
                <div class="w-40">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Priority</label>
                    <select class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"><option>All Priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
                </div>
                <button class="px-4 py-2 border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 flex items-center gap-2">
                    <i data-lucide="filter" class="w-4 h-4"></i> More Filters
                </button>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col">
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-slate-700">ID <i data-lucide="chevron-down" class="inline w-3 h-3"></i></th>
                                <th class="px-6 py-3 font-medium">Customer</th>
                                <th class="px-6 py-3 font-medium">Subject</th>
                                <th class="px-6 py-3 font-medium">Category</th>
                                <th class="px-6 py-3 font-medium">Priority</th>
                                <th class="px-6 py-3 font-medium">Status</th>
                                <th class="px-6 py-3 font-medium">Agent</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-slate-700">Created <i data-lucide="chevron-down" class="inline w-3 h-3"></i></th>
                                <th class="px-6 py-3 font-medium text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="complaints-tbody" class="divide-y divide-slate-200">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="px-6 py-4 border-t border-slate-200 flex items-center justify-between bg-slate-50">
                    <p class="text-sm text-slate-600">Showing <span class="font-medium">1</span> to <span class="font-medium">10</span> of <span class="font-medium">97</span> results</p>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 border border-slate-300 rounded text-sm disabled:opacity-50" disabled>Previous</button>
                        <button class="px-3 py-1 bg-indigo-600 text-white rounded text-sm">1</button>
                        <button class="px-3 py-1 border border-slate-300 rounded text-sm">2</button>
                        <button class="px-3 py-1 border border-slate-300 rounded text-sm">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/complaints.js"></script>
</body>
</html>
