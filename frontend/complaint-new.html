<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Complaint | ComplaintIQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex z-20">
        <!-- Sidebar content (abbreviated for brevity) -->
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <i data-lucide="cpu" class="w-6 h-6 text-indigo-600 mr-2"></i>
            <span class="text-xl font-bold text-slate-800">Complaint<span class="text-indigo-600">IQ</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="home" class="w-5 h-5 mr-3"></i>Dashboard</a>
            <a href="complaints.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-50"><i data-lucide="message-square" class="w-5 h-5 mr-3"></i>Complaints</a>
            <a href="complaint-new.html" class="sidebar-nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-600 bg-indigo-50 text-indigo-600"><i data-lucide="plus-circle" class="w-5 h-5 mr-3"></i>New Complaint</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 z-10">
            <h1 class="text-xl font-semibold text-slate-800">Log New Complaint</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-6 flex justify-center">
            <div class="max-w-3xl w-full">
                
                <form id="newComplaintForm" class="space-y-6">
                    <!-- Section 1 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h2 class="text-lg font-medium text-slate-800 border-b border-slate-200 pb-3 mb-4">1. Customer Information</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Full Name *</label>
                                <input type="text" id="custName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
                                <input type="email" id="custEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Phone *</label>
                                <input type="tel" id="custPhone" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- Section 2 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h2 class="text-lg font-medium text-slate-800 border-b border-slate-200 pb-3 mb-4">2. Complaint Details</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Subject *</label>
                                <input type="text" id="subject" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Description *</label>
                                <textarea id="description" required rows="4" minlength="20" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                                <p class="text-xs text-slate-500 mt-1">Minimum 20 characters.</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Product/Service *</label>
                                    <input type="text" id="product" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Order/Ref Number</label>
                                    <input type="text" id="orderRef" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3 -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h2 class="text-lg font-medium text-slate-800 border-b border-slate-200 pb-3 mb-4">3. Classification</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Manual Category (Optional)</label>
                                <select id="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="">Let AI Classify</option>
                                    <option>Shipping</option>
                                    <option>Product Quality</option>
                                    <option>Billing</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Channel *</label>
                                <select id="channel" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                    <option>Email</option>
                                    <option>Phone</option>
                                    <option>Web Form</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="window.history.back()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium">Cancel</button>
                        <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium flex items-center gap-2">
                            Submit & Run AI Analysis
                        </button>
                    </div>
                </form>

                <!-- AI Panel (hidden by default) -->
                <div id="aiPanel" class="hidden mt-8 bg-indigo-50 rounded-xl border border-indigo-200 p-6 shadow-sm">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="sparkles" class="w-5 h-5 text-indigo-600"></i>
                        <h2 class="text-lg font-semibold text-indigo-900">AI Classification Results</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-white p-3 rounded border border-indigo-100">
                            <p class="text-xs text-slate-500">Suggested Category</p>
                            <p class="font-medium text-slate-800">Shipping Delay <span class="text-xs text-emerald-600 bg-emerald-50 px-1 rounded ml-2">95%</span></p>
                        </div>
                        <div class="bg-white p-3 rounded border border-indigo-100">
                            <p class="text-xs text-slate-500">Priority Level</p>
                            <p class="font-medium text-amber-600">High <span class="text-xs text-amber-600 bg-amber-50 px-1 rounded ml-2">88%</span></p>
                        </div>
                        <div class="bg-white p-3 rounded border border-indigo-100">
                            <p class="text-xs text-slate-500">Sentiment</p>
                            <p class="font-medium text-rose-600">Angry</p>
                        </div>
                        <div class="bg-white p-3 rounded border border-indigo-100">
                            <p class="text-xs text-slate-500">Suggested Dept</p>
                            <p class="font-medium text-slate-800">Logistics</p>
                        </div>
                    </div>
                    <button class="w-full py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700" onclick="window.location.href='complaint-detail.html?id=C-1006'">Accept & View Complaint</button>
                </div>

            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/complaint-form.js"></script>
</body>
</html>
